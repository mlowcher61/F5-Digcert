---
# Renewal configuration
renewal_threshold_days: 30
dry_run: false
key_size: 4096
# Requested certificate validity, in DAYS.
# CA/Browser Forum ballot SC-081v3 caps TLS certificate lifetime at:
#   200 days from 2026-03-15, 100 days from 2027-03-15, 47 days from 2029-03-15.
# Review this value before each step-down date.
digicert_validity_days: 200

# Post-deployment expiry assertion, derived from the requested validity so it
# stays correct as the CA/B maximum steps down. 14 days of slack absorbs CA-side
# rounding and the gap between order placement and issuance.
verify_min_remaining_days: "{{ (digicert_validity_days | int) - 14 }}"
state_dir: "{{ playbook_dir }}/state"
max_retries: 3
retry_delay_seconds: 10
sequential_devices: true

# DigiCert API
# digicert_api_key and digicert_org_id are injected by the DigiCert AAP credential type
digicert_base_url: "https://www.digicert.com/services/v2"

# BIG-IP connection
# ansible_user and ansible_password are injected by the AAP Network credential type
bigip_port: 443
bigip_validate_certs: true
bigip_partition: Common

bigip_provider:
  server: "{{ inventory_hostname }}"
  server_port: "{{ bigip_port }}"
  user: "{{ ansible_user }}"
  password: "{{ ansible_password }}"
  validate_certs: "{{ bigip_validate_certs }}"
  no_f5_teem: true

# SSL profiles declared per host in host_vars
bigip_ssl_profiles: []

# ServiceNow ITSM integration
servicenow_enabled: true
servicenow_change_type: standard  # pre-approved Standard change
servicenow_change_template: ""  # optional Standard Change template name/sys_id
servicenow_assignment_group: ""  # optional assignment group
servicenow_close_code: successful  # close_code used on successful verification

# sn_host/sn_username/sn_password are injected by the ServiceNow ITSM credential
sn_instance:
  host: "{{ sn_host | default('') }}"
  username: "{{ sn_username | default('') }}"
  password: "{{ sn_password | default('') }}"

# Per-host map of profile_name -> {number, sys_id}; populated by tickets.yml
profile_ticket_map: {}
