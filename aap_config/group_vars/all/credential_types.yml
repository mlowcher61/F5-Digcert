---
# Custom credential type for the DigiCert CertCentral REST API.
# Mirrors ../../credential_types/digicert.yml.
controller_credential_types:
  - name: DigiCert CertCentral
    description: API credentials for DigiCert CertCentral REST API
    kind: cloud
    inputs:
      fields:
        - id: digicert_api_key
          type: string
          label: DigiCert API Key
          secret: true
        - id: digicert_org_id
          type: string
          label: DigiCert Organization ID
      required:
        - digicert_api_key
        - digicert_org_id
    injectors:
      extra_vars:
        digicert_api_key: "{{ digicert_api_key }}"
        digicert_org_id: "{{ digicert_org_id }}"
    state: present

  - name: ServiceNow ITSM
    description: ServiceNow ITSM REST API credentials
    kind: cloud
    inputs:
      fields:
        - id: sn_host
          type: string
          label: ServiceNow Host URL
          help_text: Full instance URL, e.g. https://dev12345.service-now.com
        - id: sn_username
          type: string
          label: ServiceNow Username
        - id: sn_password
          type: string
          label: ServiceNow Password
          secret: true
      required:
        - sn_host
        - sn_username
        - sn_password
    injectors:
      extra_vars:
        sn_host: "{{ sn_host }}"
        sn_username: "{{ sn_username }}"
        sn_password: "{{ sn_password }}"
    state: present
